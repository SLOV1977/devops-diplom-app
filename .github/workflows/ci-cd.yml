name: CI/CD for Test App

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Compute image tags
        id: tags
        run: |
          REPO=${{ secrets.DOCKERHUB_USERNAME }}/devops-diplom-app
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # по тегу: только версионный тег
            echo "tags=${REPO}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # по коммиту: дата + короткий sha (20261112-abc123)
            DATE=$(date +%Y%m%d)
            SHORT_SHA=${GITHUB_SHA:0:6}
            echo "tags=${REPO}:${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-app
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.INFRA_REPO }}
          ref: main
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy manifests
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/devops-diplom-app:${{ github.ref_name }}"
          sed "s|APP_IMAGE|${IMAGE}|g" infra/k8s-config/app/manifests.yaml > /tmp/manifests.yaml
          kubectl apply -f /tmp/manifests.yaml
          kubectl rollout status deployment/devops-diplom-app -n app --timeout=180s

      - name: Smoke test (in-cluster)
        run: |
          kubectl -n app get pods -o wide
          # ИЗМЕНЕНО: ретраи — сразу после прерывания ноды под может
          # ещё подниматься на второй ноде
          for i in 1 2 3; do
            if kubectl -n app run smoke-${{ github.run_id }} --rm -i --restart=Never \
                 --image=curlimages/curl -- \
                 curl -sf --max-time 10 http://devops-diplom-app/; then
              exit 0
            fi
            echo "попытка $i не удалась, повтор через 15 с"; sleep 15
          done
          exit 1
