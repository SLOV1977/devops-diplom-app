name: CI/CD for Test App

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Compute image tags
        id: tags
        run: |
          REPO=${{ secrets.DOCKERHUB_USERNAME }}/devops-diplom-app
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # по тегу: только версионный тег
            echo "tags=${REPO}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # по коммиту: дата + короткий sha, как в README (20241217-abc123)
            DATE=$(date +%Y%m%d)
            SHORT_SHA=${GITHUB_SHA:0:6}
            echo "tags=${REPO}:${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy new image
        run: |
          IMAGE_TAG=${{ github.ref_name }}
          echo "Deploying image with tag: $IMAGE_TAG"
          kubectl set image deployment/devops-diplom-app \
            devops-diplom-app=${{ secrets.DOCKERHUB_USERNAME }}/devops-diplom-app:$IMAGE_TAG \
            --namespace app
          kubectl rollout status deployment/devops-diplom-app \
            --namespace app --timeout=180s

      - name: Smoke test (in-cluster)
        run: |
          kubectl -n app get pods -o wide
          kubectl -n app run smoke-${{ github.run_id }} --rm -i --restart=Never \
            --image=curlimages/curl -- \
            curl -sf --max-time 10 http://devops-diplom-app/
